name: Build VSIX (Gatling Cursor Pack)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".cursor/**"
      - "vscode-gatling-cursor-pack/**"
      - "mcp.json.example"
      - "AGENTS.md"
      - "scripts/bundle-vsix-pack.sh"
      - ".github/workflows/build-vsix.yml"

# write: rolling release job updates tag + assets for “latest” VSIX download
permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-gatling-cursor-pack/package-lock.json

      - name: Bundle pack from repo root
        run: ./scripts/bundle-vsix-pack.sh

      # vsce requires a resolvable repository; point at this fork (monorepo subfolder).
      - name: Set extension repository URL for vsce
        working-directory: vscode-gatling-cursor-pack
        run: |
          jq --arg u "https://github.com/${{ github.repository }}.git" \
            '.repository = {"type":"git","url":$u,"directory":"vscode-gatling-cursor-pack"}' \
            package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Install dependencies and package VSIX
        working-directory: vscode-gatling-cursor-pack
        run: |
          npm ci
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: gatling-cursor-pack-vsix
          path: vscode-gatling-cursor-pack/*.vsix
          if-no-files-found: error
          # Keep the file on the latest run easy to find (org max may still apply)
          retention-days: 90

  # Durable “latest” download: GitHub Releases (pre-release), updated in place each run.
  # Workflow Artifacts remain on the run Summary; this job mirrors the VSIX onto one rolling Release.
  publish-rolling-release:
    name: Publish VSIX to rolling Release (latest)
    needs: vsix
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: gatling-cursor-pack-vsix
          path: vsix-out

      - name: Attach VSIX to rolling pre-release (always “latest” build from main/master)
        uses: ncipollo/release-action@v1
        with:
          tag: rolling-vsix
          name: Latest VSIX build (main)
          body: |
            **Automated build** — commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on `${{ github.ref_name }}`.

            Download the `.vsix` below. This pre-release is **replaced** on each successful workflow run (same tag).

            For **versioned** installs, use a tag `v*` (see `release-vsix.yml`) or the workflow **Artifacts** on the run you care about.
          artifacts: vsix-out/*.vsix
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
