# Builds the VSIX and attaches it to a GitHub Release when you push a version tag (e.g. v0.1.0).
# Path filters do not apply to tag pushes, so releases always build.

name: Release VSIX (GitHub Release)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-gatling-cursor-pack/package-lock.json

      - name: Bundle pack from repo root
        run: ./scripts/bundle-vsix-pack.sh

      - name: Set extension repository URL for vsce
        working-directory: vscode-gatling-cursor-pack
        run: |
          jq --arg u "https://github.com/${{ github.repository }}.git" \
            '.repository = {"type":"git","url":$u,"directory":"vscode-gatling-cursor-pack"}' \
            package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Install dependencies and package VSIX
        working-directory: vscode-gatling-cursor-pack
        run: |
          npm ci
          npm run package

      - name: Publish GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-gatling-cursor-pack/*.vsix
          generate_release_notes: true
