# On tag v*:
# 1) GitHub Release for that tag with a VSIX named gatling-cursor-pack-<tag>.vsix
# 2) Rolling pre-release "rolling-vsix" updated with the same VSIX (always "head" / latest build from tags)

name: Release VSIX (GitHub Release)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-gatling-cursor-pack/package-lock.json

      - name: Bundle pack from repo root
        run: ./scripts/bundle-vsix-pack.sh

      - name: Set extension repository URL for vsce
        working-directory: vscode-gatling-cursor-pack
        run: |
          jq --arg u "https://github.com/${{ github.repository }}.git" \
            '.repository = {"type":"git","url":$u,"directory":"vscode-gatling-cursor-pack"}' \
            package.json > package.json.tmp && mv package.json.tmp package.json

      # npm ci requires package.json and package-lock.json root versions to match committed files first.
      - name: Install dependencies
        working-directory: vscode-gatling-cursor-pack
        run: npm ci

      # Cursor reads extension version from package.json; align both manifests with the tag (not committed).
      - name: Set extension version from git tag (package.json + package-lock.json)
        working-directory: vscode-gatling-cursor-pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Version from tag $TAG => $VERSION (ephemeral on runner only)"
          # vsce requires numeric semver; vO.1.3 (letter O) yields O.1.3 and fails — fail fast with a clear hint.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid tag for VSIX::Version after 'v' must be semver with digits, e.g. v0.1.3. Got '$VERSION' from tag '$TAG'. Common mistake: letter O instead of digit 0 (vO.1.3)."
            exit 1
          fi
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' package-lock.json > package-lock.json.tmp && mv package-lock.json.tmp package-lock.json

      - name: Package VSIX
        working-directory: vscode-gatling-cursor-pack
        run: npm run package

      - name: Add VSIX copy named after the git tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(vscode-gatling-cursor-pack/*.vsix)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "error: expected exactly one .vsix, got: ${files[*]}"
            exit 1
          fi
          cp "${files[0]}" "vscode-gatling-cursor-pack/gatling-cursor-pack-${TAG}.vsix"
          ls -la vscode-gatling-cursor-pack/*.vsix

      - name: Publish GitHub Release for this tag (versioned VSIX)
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-gatling-cursor-pack/gatling-cursor-pack-${{ github.ref_name }}.vsix
          generate_release_notes: true

      - name: Update rolling "latest" pre-release (same VSIX)
        uses: ncipollo/release-action@v1
        with:
          tag: rolling-vsix
          name: Latest VSIX (rolling)
          body: |
            **Rolling build** — same `.vsix` as the latest tag **[`${{ github.ref_name }}`](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})** (commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})).

            Download **`gatling-cursor-pack-${{ github.ref_name }}.vsix`** below. This pre-release is **replaced** each time you push a `v*` tag.
          artifacts: vscode-gatling-cursor-pack/gatling-cursor-pack-${{ github.ref_name }}.vsix
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
